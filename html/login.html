<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تسجيل الدخول | مركز الشفاء للعلاج الطبيعي</title>
  <meta name="description" content="سجّل دخولك أو أنشئ حساباً جديداً في مركز الشفاء لحجز جلساتك العلاجية.">
  <link rel="stylesheet" href="Css/style.css">
</head>
<body>

  <main class="auth-page">
      <div class="auth-modal" aria-labelledby="auth-title">
        <a class="auth-close" href="index.html" aria-label="العودة للصفحة الرئيسية" title="العودة للرئيسية">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m3 11 9-8 9 8"/>
            <path d="M5 10v10h14V10"/>
          </svg>
        </a>
        <aside class="auth-side">
          <img src="images/auth-side.jpg" alt="">
          <div class="auth-side-text">
            <img class="auth-logo" src="images/logo.png" alt="شعار مركز الشفاء">
            <h2>مرحباً بك في مركز الشفاء</h2>
            <p>سجّل دخولك لحجز جلساتك العلاجية ومتابعة خطتك خطوة بخطوة.</p>
          </div>
        </aside>
        <div class="auth-main">
          <div class="auth-views">
            <section class="auth-view is-active" data-name="login">
              <h2 id="auth-title">تسجيل الدخول</h2>
              <p class="auth-sub">أدخل بياناتك للمتابعة وحجز موعدك.</p>
              <div class="auth-alert" id="login-alert" role="alert">
              </div>
              <form id="login-form" novalidate>
                <div class="form-group">
                  <label for="l-phone">رقم الجوال</label>
                  <input id="l-phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="+249 X XXX XXXX">
                  <small class="form-error" role="alert">
                  </small>
                </div>
                <div class="form-group">
                  <label for="l-pass">كلمة المرور</label>
                  <div class="pw-wrap">
                    <input id="l-pass" type="password" autocomplete="current-password">
                    <button type="button" class="pw-toggle" data-target="l-pass" aria-label="إظهار أو إخفاء كلمة المرور">
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                        <circle cx="12" cy="12" r="3"/>
                      </svg>
                    </button>
                  </div>
                  <small class="form-error" role="alert">
                  </small>
                </div>
                <button type="submit" class="btn btn-primary btn-block">تسجيل الدخول</button>
              </form>
              <div class="auth-divider">ليس لديك حساب؟</div>
              <button type="button" class="btn btn-outline btn-block" data-go="register">إنشاء حساب جديد</button>
            </section>
            <section class="auth-view" data-name="register">
              <h2>إنشاء حساب جديد</h2>
              <p class="auth-sub">بيانات بسيطة تساعدنا على خدمتك بشكل أفضل.</p>
              <div class="reg-progress">
                <span id="reg-label">الخطوة 1 من 2: بيانات الحساب</span>
                <div class="reg-bar" id="reg-bar">
                  <span>
                  </span>
                </div>
              </div>
              <div class="auth-alert" id="reg-alert" role="alert">
              </div>
              <form id="register-form" novalidate>
                <div class="reg-steps">
                  <div class="reg-step is-active" data-step="1">
                    <div class="form-row">
<div class="form-group">
                      <label for="r-name">الاسم الكامل</label>
                      <input id="r-name" type="text" autocomplete="name">
                      <small class="form-error" role="alert">
                      </small>
                    </div>
                    <div class="form-group">
                      <label for="r-phone">رقم الجوال</label>
                      <input id="r-phone" type="tel" dir="ltr" inputmode="tel" autocomplete="tel" placeholder="+249 X XXX XXXX">
                      <small class="form-error" role="alert">
                      </small>
                    </div>
</div>
                    <div class="form-row">
<div class="form-group">
                      <label for="r-pass">كلمة المرور</label>
                      <div class="pw-wrap">
                        <input id="r-pass" type="password" autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-target="r-pass" aria-label="إظهار أو إخفاء كلمة المرور">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                          </svg>
                        </button>
                      </div>
                      <small class="form-error" role="alert">
                      </small>
                    </div>
                    <div class="form-group">
                      <label for="r-pass2">تأكيد كلمة المرور</label>
                      <div class="pw-wrap">
                        <input id="r-pass2" type="password" autocomplete="new-password">
                        <button type="button" class="pw-toggle" data-target="r-pass2" aria-label="إظهار أو إخفاء كلمة المرور">
                          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                            <circle cx="12" cy="12" r="3"/>
                          </svg>
                        </button>
                      </div>
                      <small class="form-error" role="alert">
                      </small>
                    </div>
</div>
                    <div class="reg-actions">
                      <button type="button" class="btn btn-primary" id="reg-next">التالي</button>
                    </div>
                  </div>
                  <div class="reg-step" data-step="2">
                    <div class="form-row">
                      <div class="form-group">
                        <label for="r-age">العمر</label>
                        <input id="r-age" type="number" min="1" max="120" inputmode="numeric">
                        <small class="form-error" role="alert">
                        </small>
                      </div>
                      <div class="form-group">
                        <label for="r-gender">الجنس</label>
                        <select id="r-gender">
                          <option value="">اختر</option>
                          <option>ذكر</option>
                          <option>أنثى</option>
                        </select>
                        <small class="form-error" role="alert">
                        </small>
                      </div>
                    </div>
                    <div class="form-group">
                      <label for="r-city">السكن (المدينة والحي)</label>
                      <input id="r-city" type="text" autocomplete="address-level2">
                      <small class="form-error" role="alert">
                      </small>
                    </div>
                    <div class="form-group">
                      <label for="r-notes">حالتك الصحية (اختياري)</label>
                      <input id="r-notes" type="text" placeholder="أمراض مزمنة أو إصابات سابقة">
                    </div>
                    <div class="reg-actions">
                      <button type="button" class="btn btn-outline btn-back" id="reg-back">رجوع</button>
                      <button type="submit" class="btn btn-primary">إنشاء الحساب</button>
                    </div>
                  </div>
                </div>
              </form>
              <div class="auth-divider">لديك حساب بالفعل؟</div>
              <button type="button" class="btn btn-outline btn-block" data-go="login">العودة لتسجيل الدخول</button>
            </section>
          </div>
        </div>
      </div>
  </main>

  <script src="Js/script.js"></script>
</body>
</html>
